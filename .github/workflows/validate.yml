name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-skills.mjs
      - run: npm ci --prefix packages/jev-pref
      - run: npm test --prefix packages/jev-pref
      - run: node packages/jev-pref/bin/jev-pref.js doctor
        continue-on-error: true # no API key in CI; reports env state only
      - run: node packages/jev-pref/bin/jev-pref.js tune --dry-run --evals-dir packages/jev-pref/evals
