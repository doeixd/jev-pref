name: jev-pref (dogfood)
on:
  pull_request:
    branches: [master]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check review credentials
        # Fork PRs cannot read secrets; the review action itself handles them
        # via on-forks (dry-run). Same-repo PRs need the key to exist.
        if: github.event.pull_request.head.repo.fork == false
        run: |
          if [ -z "${{ secrets.TYPESAFE_API_KEY }}" ]; then
            echo "review-error: TYPESAFE_API_KEY secret is not set on this repo."
            echo "Add it under Settings > Secrets and variables > Actions (value only, never in files)."
            exit 1
          fi
      - uses: ./actions/review
        with:
          fail-on: gates
          comment-mode: both
          engine: ./packages/jev-pref/bin/jev-pref.js
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
