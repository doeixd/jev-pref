name: jev-pref (strict)
on:
  pull_request:
    branches: [master]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: doeixd/jev-pref/actions/review@master
        with:
          fail-on: gates
          comment-mode: both
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
