name: jev-pref

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: doeixd/jev-pref/actions/review@master
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          fail-on: gates
